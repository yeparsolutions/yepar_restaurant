# ============================================================
# YEPAR RESTAURANT — backend/pytest.ini
# Configuración de pytest. Se ejecuta desde la carpeta backend.
# ============================================================
[pytest]
pythonpath = .
testpaths = tests
filterwarnings =
    # SQLite guarda los Numeric como float internamente; en PostgreSQL son exactos.
    ignore::sqlalchemy.exc.SAWarning
    # Aviso interno de las librerías del cliente de pruebas HTTP (no es de nuestro código).
    ignore:The anyio.abc.BlockingPortal alias:DeprecationWarning
