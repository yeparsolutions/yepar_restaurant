# ============================================================
# YEPAR RESTAURANT — backend/alembic.ini
# Configuración de Alembic (migraciones de la base de datos).
# La URL de la base NO va aquí: sale de la variable DATABASE_URL (ver migraciones/env.py).
#
# Uso (desde la carpeta backend):
#   alembic upgrade head                      # aplica todas las migraciones pendientes
#   alembic revision --autogenerate -m "..."  # crea una migración nueva a partir de los modelos
#   alembic check                             # avisa si los modelos y las migraciones se separaron
# ============================================================
[alembic]
script_location = migraciones
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
